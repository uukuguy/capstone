name: verify

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:
    inputs:
      release:
        description: Run complete baseline or release verification
        type: boolean
        default: false

concurrency:
  group: verify-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  verify:
    env:
      UV_PYTHON: "3.12"
      NO_PROXY: "127.0.0.1,localhost"
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.base_ref == 'main' || github.ref_name == 'main' || (github.event_name == 'workflow_dispatch' && inputs.release)) && '["ubuntu-latest","macos-latest"]' || '["macos-latest"]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Select verification scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          TARGET_BRANCH: ${{ github.base_ref || github.ref_name }}
          RELEASE_CHECK: ${{ github.event_name == 'workflow_dispatch' && inputs.release }}
        run: |
          if [ "$TARGET_BRANCH" = "main" ] || [ "$RELEASE_CHECK" = "true" ]; then
            gate=release
          elif [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            gate=product
          else
            gate=$(python3 tools/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" --target "$TARGET_BRANCH")
          fi
          case "$gate" in docs|governance|app|gateway-controls|gateway-bindings|workbench|shared-agent|adaptive-agent|conversation-runtime|source-topology|foundation|native-runtime|product|release) ;; *) exit 1 ;; esac
          echo "gate=$gate" >> "$GITHUB_OUTPUT"
      # Pinned per https://github.com/astral-sh/setup-uv (v10.0.1).
      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22.19.0"
      - name: Set up standard dependencies
        if: steps.scope.outputs.gate != 'gateway-bindings'
        run: make setup
      - name: Set up gateway binding dependencies
        if: steps.scope.outputs.gate == 'gateway-bindings'
        run: |
          uv sync --project packages/grid-agent
          uv sync --project packages/capstone-agent
          # Doctor resolves the managed gridctl executable; no solver suite or assets.
          uv sync --project packages/grid-simulator
          npm ci --prefix packages/capstone-app
      - run: make install-pi
      - name: Check managed runtime
        run: make doctor
      - name: Verify documentation and control tooling
        if: steps.scope.outputs.gate == 'docs' || steps.scope.outputs.gate == 'governance'
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          test "$(readlink CLAUDE.md)" = AGENTS.md
          python3 -m py_compile tools/render_project_overview.py tools/ci_scope.py
          python3 tools/ci_scope.py --base "$BASE_SHA" --head "$HEAD_SHA" --check-docs
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify governance contracts
        if: steps.scope.outputs.gate != 'docs'
        run: PYTHONPATH=. uv run --project packages/grid-agent python -m pytest tools/tests/test_ci_scope.py tools/tests/test_ci_workbench_scope.py tools/tests/test_ci_gateway_controls.py tools/tests/test_ci_gateway_bindings.py tools/tests/test_verification_targets.py tools/tests/test_issue_automation*.py -q
      - name: Verify App only
        if: steps.scope.outputs.gate == 'app'
        timeout-minutes: 5
        run: make test-capstone-app build-capstone-app
      - name: Verify gateway controls
        if: steps.scope.outputs.gate == 'gateway-controls'
        timeout-minutes: 5
        run: |
          make check-package-boundaries check-types test-capstone-app build-capstone-app
          uv run --project packages/capstone-agent pytest packages/capstone-agent/tests/test_gateway_connections*.py packages/capstone-agent/tests/test_general_pi_server.py packages/capstone-agent/tests/test_general_pi_native.py packages/capstone-agent/tests/test_pi_delegation.py packages/capstone-agent/tests/test_host_api.py packages/capstone-agent/tests/test_thread_http_api.py packages/capstone-agent/tests/test_network_policy_http.py packages/capstone-agent/tests/test_native_network_policy.py packages/capstone-agent/tests/test_grid_source_http.py packages/capstone-agent/tests/test_grid_electrical_view.py packages/capstone-agent/tests/test_thread_input_catalog.py tools/tests/test_host_runtime_contract.py tools/tests/test_image_layer_order.py -q
      - name: Verify gateway bindings
        if: steps.scope.outputs.gate == 'gateway-bindings'
        timeout-minutes: 5
        run: |
          make check-package-boundaries
          npm --prefix packages/capstone-app run check
          npm --prefix packages/capstone-app test -- src/electricalModelView.test.ts
          uv run --project packages/grid-agent pyright packages/capstone-agent/src/capstone_agent/data_gateway_views.py packages/capstone-agent/src/capstone_agent/data_gateway_relay.py packages/capstone-agent/src/capstone_agent/data_gateway_mcp.py packages/capstone-agent/src/capstone_agent/grid_source_topology.py packages/capstone-agent/src/capstone_agent/grid_source_http.py packages/capstone-agent/src/capstone_agent/grid_electrical_view.py packages/capstone-agent/src/capstone_agent/general_pi_server.py packages/capstone-agent/src/capstone_agent/pi_delegation.py packages/capstone-agent/src/capstone_agent/delegated_runtime.py
          uv run --project packages/capstone-agent pytest packages/capstone-agent/tests/test_data_gateway_*.py packages/capstone-agent/tests/test_grid_source_*.py packages/capstone-agent/tests/test_grid_electrical_view.py packages/capstone-agent/tests/test_general_pi_server.py packages/capstone-agent/tests/test_pi_delegation.py packages/capstone-agent/tests/test_delegated_runtime.py packages/capstone-agent/tests/test_graph_host_observation.py tools/tests/test_host_runtime_contract.py tools/tests/test_image_layer_order.py -q
          node --test packages/capstone-agent/tests/fixtures/gateway-tool-use.test.mjs packages/capstone-agent/tests/fixtures/tool-discovery.test.mjs packages/capstone-agent/tests/fixtures/tool-composition.test.mjs packages/capstone-agent/tests/fixtures/data-gateway-research.test.mjs
      - name: Verify enterprise workbench
        if: steps.scope.outputs.gate == 'workbench'
        timeout-minutes: 15
        run: |
          make check-package-boundaries check-types test-capstone-agent test-kernel test-capstone-app build-capstone-app test-capstone-client test-registered-workers test-generic-tools
          node --test packages/capstone-agent/tests/*.test.mjs packages/capstone-agent/tests/fixtures/*.test.mjs
          uv run --project packages/capstone-agent pytest packages/capstone-agent/tests/test_enterprise_research_pack.py packages/capstone-agent/tests/test_research_policy_compatibility.py tools/tests/test_host_runtime_contract.py tools/tests/test_image_layer_order.py tools/tests/test_native_report.py -q
          uv run --project packages/capstone-agent --with pillow==12.3.0 --with python-pptx==1.0.2 python -m pytest tools/tests/test_native_presentation.py -q
          uv run --project packages/grid-agent pytest packages/grid-agent/tests/application/test_hosted.py packages/grid-agent/tests/application/test_hosted_thread.py packages/grid-agent/tests/application/test_hosted_model_metadata.py packages/grid-agent/tests/application/test_hosted_runtime_warmup.py -q
      - name: Verify shared agent dependencies
        if: steps.scope.outputs.gate == 'shared-agent'
        timeout-minutes: 15
        run: make check-package-boundaries check-types test-capstone-agent test-kernel test-capstone-app build-capstone-app test-capstone-client test-registered-workers
      - name: Verify conversation runtime consumers
        if: steps.scope.outputs.gate == 'conversation-runtime'
        timeout-minutes: 10
        run: |
          make check-package-boundaries check-types test-capstone-app build-capstone-app test-capstone-client
          uv run --project packages/capstone-agent pytest -q packages/capstone-agent/tests/test_general_pi_*.py packages/capstone-agent/tests/test_harness.py packages/capstone-agent/tests/test_delegated_runtime.py packages/capstone-agent/tests/test_thread_http_api.py packages/capstone-agent/tests/test_enterprise_normal_chat.py packages/capstone-agent/tests/test_thread_work.py packages/capstone-agent/tests/test_thread_work_execution.py packages/capstone-agent/tests/test_thread_worker.py packages/capstone-agent/tests/test_attempt_research.py packages/capstone-agent/tests/test_native_diagnosis.py
          node --test packages/capstone-agent/tests/*.test.mjs packages/capstone-agent/tests/fixtures/*.test.mjs
          node --test packages/pi-capability-tools/test/*.test.mjs
          uv run --project packages/capstone-agent pytest tools/tests/test_image_layer_order.py tools/tests/test_host_runtime_contract.py -q
      - name: Verify adaptive agent consumers
        if: steps.scope.outputs.gate == 'adaptive-agent'
        timeout-minutes: 15
        run: |
          make check-package-boundaries check-types test-capstone-agent test-kernel test-capstone-app build-capstone-app test-capstone-client test-registered-workers
          node --test packages/capstone-agent/tests/*.test.mjs packages/capstone-agent/tests/fixtures/*.test.mjs
          node --test packages/pi-capability-tools/test/*.test.mjs
          uv run --project packages/capstone-agent pytest packages/capstone-agent/tests/test_graph_research_publication.py packages/capstone-agent/tests/test_research_policy_compatibility.py packages/capstone-agent/tests/test_adaptive_agent_profile.py -q
      - name: Verify source topology consumers
        if: steps.scope.outputs.gate == 'source-topology'
        timeout-minutes: 10
        run: |
          make check-package-boundaries check-types test-capstone-app build-capstone-app test-capstone-client
          uv run --project packages/capstone-agent pytest -q packages/capstone-agent/tests/test_grid_source_*.py packages/capstone-agent/tests/test_pi_delegation.py packages/capstone-agent/tests/test_general_pi_*.py packages/capstone-agent/tests/test_host*.py packages/capstone-agent/tests/test_thread*.py packages/capstone-agent/tests/test_data_gateway_*.py packages/capstone-agent/tests/test_network_policy_http.py packages/capstone-agent/tests/test_native_network_policy.py packages/capstone-agent/tests/test_enterprise_normal_chat.py packages/capstone-agent/tests/test_native_session_profile.py packages/capstone-agent/tests/test_harness.py packages/capstone-agent/tests/test_delegated_runtime.py packages/capstone-agent/tests/test_graph_host_observation.py
          node --test packages/capstone-agent/tests/*.test.mjs packages/capstone-agent/tests/fixtures/*.test.mjs
          uv run --project packages/capstone-agent pytest tools/tests/test_image_layer_order.py tools/tests/test_host_runtime_contract.py -q
      - name: Verify shared foundation assembly
        if: steps.scope.outputs.gate == 'foundation' || steps.scope.outputs.gate == 'native-runtime'
        timeout-minutes: 15
        run: |
          make check-package-boundaries check-types test-capstone-agent test-kernel test-capstone-app build-capstone-app test-capstone-client test-registered-workers test-domain-package
          uv run --project packages/pypsa-agent pytest packages/pypsa-agent/tests -q
          uv run --project packages/inventory-domain-pack pytest packages/inventory-domain-pack/tests/test_application_conformance.py packages/inventory-domain-pack/tests/test_multi_binding_application.py -q
          uv run --project packages/grid-agent pytest packages/grid-agent/tests/application/test_hosted.py packages/grid-agent/tests/application/test_hosted_thread.py packages/grid-agent/tests/application/test_hosted_model_metadata.py -q
          uv run --project packages/grid-agent pytest packages/grid-agent/tests/application/test_hosted_runtime_warmup.py packages/grid-agent/tests/application/test_generic_entrypoint.py packages/grid-agent/tests/application/test_composition.py packages/grid-agent/tests/application/test_profile.py packages/grid-agent/tests/domain/test_profile.py packages/grid-agent/tests/domain/test_pandapower_profile.py packages/grid-agent/tests/test_thread_model_diagram.py packages/grid-agent/tests/test_worker_network_view.py -q
      - name: Verify native runtime consumers
        if: steps.scope.outputs.gate == 'native-runtime'
        timeout-minutes: 10
        run: |
          make test-local-rebuild test-inventory-pi test-pi-capture-runtime check-runtime-risk
          uv run --project packages/grid-simulator pytest packages/grid-simulator/tests/test_powermcp_audit.py -q
          node --test packages/capstone-agent/tests/*.test.mjs packages/capstone-agent/tests/fixtures/*.test.mjs
      - name: Verify formal applications
        if: steps.scope.outputs.gate == 'product'
        run: make check-pr
      - name: Verify baseline or release
        if: steps.scope.outputs.gate == 'release'
        run: make check-release
      - name: Show failed offline validation checks
        if: failure()
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report_path = Path("runs/validation-offline.json")
          if report_path.is_file():
              report = json.loads(report_path.read_text())
              print("Offline validation:", report.get("summary"))
              for case in report.get("cases", []):
                  if case.get("passed") is not True:
                      print(json.dumps({
                          "case_id": case.get("case_id"),
                          "checks": case.get("checks"),
                          "errors": case.get("errors"),
                      }, ensure_ascii=False))
          PY
