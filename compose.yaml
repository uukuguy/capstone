name: capstone

x-host-environment: &host-environment
  CAPSTONE_RUNTIME_PROFILE: ${CAPSTONE_RUNTIME_PROFILE-capstone-workbench-v1}
  DATABASE_URL: postgresql://capstone:${POSTGRES_PASSWORD:?Set deploy/local.env}@postgres:5432/capstone
  CAPSTONE_OPERATOR_TOKEN: ${CAPSTONE_OPERATOR_TOKEN:?Set deploy/local.env}
  CAPSTONE_PUBLIC_DEMO: ${CAPSTONE_PUBLIC_DEMO:-true}
  CAPSTONE_THREAD_OPEN_ACCESS: ${CAPSTONE_THREAD_OPEN_ACCESS:-true}
  CAPSTONE_HOSTED_APPLICATION: ${CAPSTONE_HOSTED_APPLICATION:-capstone}
  CAPSTONE_THREAD_VALIDATION: ${CAPSTONE_THREAD_VALIDATION:-}
  CAPSTONE_DEPLOYMENT_STAGE: ${CAPSTONE_DEPLOYMENT_STAGE:-local}
  CAPSTONE_PUBLIC_PROVIDER: ${CAPSTONE_PUBLIC_PROVIDER:?Set deploy/local.env}
  CAPSTONE_PUBLIC_MODEL: ${CAPSTONE_PUBLIC_MODEL:?Set deploy/local.env}
  CAPSTONE_GENERAL_EXECUTOR_ORIGIN: http://general-pi:8790
  CAPSTONE_GENERAL_CONTROL_TOKEN: ${CAPSTONE_GENERAL_CONTROL_TOKEN:?Set deploy/local.env}
  CAPSTONE_ENABLE_NETWORK_STEP_LINK: ${CAPSTONE_ENABLE_NETWORK_STEP_LINK:-false}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  CAPSTONE_SESSION_IDLE_SECONDS: ${CAPSTONE_SESSION_IDLE_SECONDS:-60}
  CAPSTONE_THREAD_CONTEXT_LIMIT: ${CAPSTONE_THREAD_CONTEXT_LIMIT:-4}
  CAPSTONE_THREAD_CONTEXT_IDLE_SECONDS: ${CAPSTONE_THREAD_CONTEXT_IDLE_SECONDS:-60}
  CAPSTONE_THREAD_ATTEMPT_TIMEOUT_SECONDS: ${CAPSTONE_THREAD_ATTEMPT_TIMEOUT_SECONDS:-600}
  CAPSTONE_THREAD_MAX_STREAMS: ${CAPSTONE_THREAD_MAX_STREAMS:-32}
  CAPSTONE_THREAD_STREAMS_PER_THREAD: ${CAPSTONE_THREAD_STREAMS_PER_THREAD:-2}
  CAPSTONE_WORKER_MAX_SESSIONS: ${CAPSTONE_WORKER_MAX_SESSIONS:-8}
  CAPSTONE_WORKER_WAKE_URL: http://worker:8766
  CAPSTONE_FAMILY_HEALTH_URLS: pandapower=http://worker:8766,pypsa=http://worker-pypsa:8766
  CAPSTONE_FEDERATED_CATALOG_CONTEXT: ${CAPSTONE_FEDERATED_CATALOG_CONTEXT:-true}
  CAPSTONE_ALLOWED_HOSTS: localhost,127.0.0.1,api
  CAPSTONE_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
  CAPSTONE_ARTIFACT_BACKEND: s3
  CAPSTONE_ARTIFACT_BUCKET: ${CAPSTONE_ARTIFACT_BUCKET:-capstone-private}
  CAPSTONE_S3_ENDPOINT: http://objects:9000
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set deploy/local.env}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set deploy/local.env}
  AWS_DEFAULT_REGION: us-east-1
  PORT: "8766"

x-host-service: &host-service
  image: ${CAPSTONE_BACKEND_IMAGE:-capstone-backend:local}
  build: .
  restart: unless-stopped
  environment: *host-environment
  depends_on:
    postgres:
      condition: service_healthy
    objects-init:
      condition: service_completed_successfully
    general-pi:
      condition: service_healthy

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set deploy/local.env}
      POSTGRES_DB: capstone
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U capstone -d capstone"]
      interval: 5s
      timeout: 3s
      retries: 20

  objects:
    image: rustfs/rustfs@sha256:8cc9801755448b71a786705ce76692c77e14936cccd87cf2fc31842e58f4d1ff
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY:?Set deploy/local.env}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY:?Set deploy/local.env}
    volumes:
      - object-data:/data

  objects-init:
    image: ${CAPSTONE_BACKEND_IMAGE:-capstone-backend:local}
    build: .
    entrypoint: [/app/packages/capstone-agent/.venv/bin/python, /app/deploy/ensure_bucket.py]
    restart: "no"
    environment:
      CAPSTONE_ARTIFACT_BUCKET: ${CAPSTONE_ARTIFACT_BUCKET:-capstone-private}
      CAPSTONE_S3_ENDPOINT: http://objects:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:?Set deploy/local.env}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:?Set deploy/local.env}
      AWS_DEFAULT_REGION: us-east-1
    depends_on:
      objects:
        condition: service_started

  api:
    <<: *host-service
    command: [api]
    depends_on:
      postgres:
        condition: service_healthy
      objects-init:
        condition: service_completed_successfully
      worker:
        condition: service_healthy
      worker-pypsa:
        condition: service_healthy
    ports:
      - 127.0.0.1:${CAPSTONE_API_PORT:-8767}:8766
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8766/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker:
    <<: *host-service
    environment:
      <<: *host-environment
      CAPSTONE_HOSTED_APPLICATION: pandapower
      CAPSTONE_THREAD_FAMILY: pandapower
    command: [worker]
    networks: [default, general-pi]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8766/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12

  worker-pypsa:
    <<: *host-service
    environment:
      <<: *host-environment
      CAPSTONE_HOSTED_APPLICATION: pypsa
      CAPSTONE_THREAD_FAMILY: pypsa
      CAPSTONE_WORKER_WAKE_URL: http://worker-pypsa:8766
    command: [worker]
    networks: [default, general-pi]
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8766/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12

  general-pi:
    image: capstone-general-pi:local
    build:
      context: .
      dockerfile: deploy/general-pi.Dockerfile
      args:
        CAPSTONE_BACKEND_IMAGE: ${CAPSTONE_BACKEND_IMAGE:-capstone-backend:local}
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, KILL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    pids_limit: 128
    networks: [general-pi]
    environment:
      CAPSTONE_PUBLIC_PROVIDER: ${CAPSTONE_PUBLIC_PROVIDER:?Set deploy/local.env}
      CAPSTONE_PUBLIC_MODEL: ${CAPSTONE_PUBLIC_MODEL:?Set deploy/local.env}
      CAPSTONE_GENERAL_CONTROL_TOKEN: ${CAPSTONE_GENERAL_CONTROL_TOKEN:?Set deploy/local.env}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
    volumes:
      - general-pi-receipts:/var/lib/general-pi/receipts
      - general-pi-profiles:/var/lib/general-pi/profiles
      - type: volume
        source: general-pi-resources
        target: /opt/general/.grid-agent/runtime
        volume:
          nocopy: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
      - /var/lib/general-pi/tasks:rw,nosuid,size=256m,mode=0711
    healthcheck:
      test: [CMD, python, -c, "from urllib.request import urlopen; urlopen('http://127.0.0.1:8790/health/ready', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 12

networks:
  general-pi:

volumes:
  postgres-data:
  object-data:
  general-pi-receipts:
  general-pi-profiles:
  general-pi-resources:
