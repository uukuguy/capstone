# Overlay on the repository Compose contract. Keep storage in this project only.
services:
  postgres:
    image: ${CAPSTONE_POSTGRES_IMAGE:?Set the exact database image}
  objects:
    image: ${CAPSTONE_OBJECTS_IMAGE:?Set the exact object-store image}
  api:
    image: ${CAPSTONE_BACKEND_IMAGE:?Set the exact intranet image}
    environment:
      CAPSTONE_ALLOWED_HOSTS: ${CAPSTONE_ALLOWED_HOSTS:-localhost,127.0.0.1,api}
      CAPSTONE_ALLOWED_ORIGINS: ${CAPSTONE_APP_ORIGIN:?Set the browser origin}
      CAPSTONE_WORKER_WAKE_URL: http://worker-native:8766
      CAPSTONE_FAMILY_HEALTH_URLS: native=http://worker-native:8766
  worker:
    profiles: [professional]
  worker-pypsa:
    profiles: [professional]
  general-pi:
    image: ${CAPSTONE_GENERAL_IMAGE:?Set the exact native executor image}
    extra_hosts: ["host.docker.internal:host-gateway"]
    # CentOS 7 needs the table to exist before the first atomic rule replacement.
    # No task starts until the normal executor has applied its complete policy.
    command: [/bin/sh, -ec, "nft add table inet capstone_tasks; exec python -m capstone_agent.general_pi_resource_seed"]
  app:
    image: ${CAPSTONE_APP_IMAGE:?Set the exact App image}
    restart: unless-stopped
    ports: ["${CAPSTONE_APP_BIND:-0.0.0.0}:${CAPSTONE_APP_PORT:-5173}:3000"]
    environment:
      CAPSTONE_APP_ORIGIN: ${CAPSTONE_APP_ORIGIN:?Set the browser origin}
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:3000/health]
      interval: 5s
      timeout: 3s
      retries: 12
