<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>Capstone · 任务状态设计验收</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f5ef;color:#253f32;font:15px/1.7 system-ui,"PingFang SC",sans-serif}header{padding:22px 5%;border-bottom:1px solid #ccd6c7;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}a{color:#305d43}main{max-width:1200px;margin:40px auto;padding:0 24px;display:grid;grid-template-columns:260px minmax(0,1fr);gap:32px}h1{font-size:27px;margin:0 0 8px}h2{font-size:20px}p{color:#60705c}button,select,input{font:inherit;min-height:44px;padding:9px 14px;border:1px solid #bdcbb6;background:white;color:inherit;border-radius:5px}button{cursor:pointer}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #9c772f;outline-offset:3px}nav button{width:100%;text-align:left;margin-bottom:9px}nav button[aria-pressed=true]{background:#294b39;color:white}.panel{background:#fffef9;border:1px solid #d4dccc;padding:28px;min-height:360px}.tag{font-size:12px;letter-spacing:1px;color:#8b692d}.status{padding:14px;background:#f5efdf;border-left:3px solid #9e7e40;margin:20px 0}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:22px 0}label{display:block;margin:14px 0}input{display:block;width:100%}.meta{font-size:12px;color:#63725b}pre{white-space:pre-wrap;overflow-wrap:anywhere}footer{margin-top:28px;border-top:1px solid #d5ddcc;padding-top:16px;font-size:12px;color:#68775f}@media(max-width:700px){main{grid-template-columns:1fr;margin-top:20px;gap:18px}nav{display:flex;flex-wrap:wrap;gap:8px}nav button{width:auto;font-size:13px;margin:0}.panel{padding:20px}}
</style><header><strong>CAPSTONE / INTERACTION STATES</strong><a href="enterprise-workspace-prototype.html">返回任务工作台</a></header><main><nav aria-label="状态样例" id="nav"></nav><section><div class="tag">交互验收原型 · 所有状态均为本地模拟</div><h1>让异常也有清楚的下一步</h1><p>这些场景用于检查交互规则，不调用模型、上传文件或更改业务配置。</p><div class="panel" id="panel"></div></section></main>
<script>
const $=id=>document.getElementById(id);
const cases={tasks:'同会话多任务',upload:'资料上传失败',question:'等待补充资料',conflict:'配置并发冲突',connection:'断线与状态补取',unknown:'外部动作结果未知',unsupported:'专业能力不可用'};
let selected='tasks',phase=0,task='市场分析';const drafts={市场分析:'补充负电价期间的对比图',故障研究:'限制切负荷总量'};
function render(){
 $('nav').innerHTML=Object.entries(cases).map(([id,title])=>`<button data-case="${id}" aria-pressed="${selected===id}">${title}</button>`).join('');
 let body='';
 if(selected==='tasks')body=`<h2>一个会话，两个独立目标</h2><label>当前任务 <select id="task"><option>市场分析</option><option>故障研究</option></select></label><p class="meta">市场分析：后台运行 · 故障研究：等待快照。切换不会暂停另一任务。</p><label>继续当前任务<input id="draft"></label><div class="status">发送目标：${task} · 明确绑定work_id</div>`;
 if(selected==='upload')body=`<h2>分析资料.csv</h2><div class="status" role="status">${phase===0?'上传失败：连接中断，尚未生成可用资源。':phase===1?'上传完成，完整性检查中；附件还不能发送。':'检查通过，资料已可用。'}</div><p>输入草稿保留；重复上传沿用同一上传身份，完成后才附到任务。</p><div class="actions"><button id="act">${phase===0?'重试上传（模拟）':phase===1?'完成检查（模拟）':'重新演示'}</button><button disabled> ${phase===2?'附件就绪 · 原型不发送':'发送不可用附件：已阻止'}</button></div>`;
 if(selected==='question')body=`<h2>新能源可用功率依据缺失</h2><p>可以继续做出力分析，但尚不能交付新能源消纳结论。</p><div class="status" role="status">${phase===0?'待补充问题 Q-01 / 目标修订 r3':phase===1?'已接收答复，等待行动边界生效。':'答复已生效；目标修订 r4，继续分析并保留原要求记录。'}</div><label>答复<input id="reply" placeholder="指定可用资料，或明确调整分析范围"></label><div class="actions"><button id="act">${phase===0?'提交答复（模拟）':phase===1?'接收生效事件（模拟）':'重新演示'}</button></div>`;
 if(selected==='conflict')body=`<h2>能力配置已由另一客户端修改</h2><p>你的草稿：通用分析＋专业计算。服务端当前：仅通用分析，修订 r8。</p><div class="status" role="status">${phase===0?'保存冲突：没有覆盖服务端配置，本地草稿保留。':'已按最新修订提交示意选择；服务端确认r9后显示生效。'}</div><div class="actions"><button id="act">${phase===0?'比较后重新提交（模拟）':'重新演示'}</button></div>`;
 if(selected==='connection')body=`<h2>后台任务持续执行</h2><div class="status" role="status">${phase===0?'连接已断开，后台状态待确认。':phase===1?'连接恢复，读取快照与缺失事件；暂不声明已完成。':'已补取到序号42：任务仍在运行，报告v2可查看。'}</div><p>重复事件去重，不重新发送任务。输入草稿保留。</p><div class="actions"><button id="act">${phase===0?'恢复连接（模拟）':phase===1?'完成补取（模拟）':'重新演示'}</button></div>`;
 if(selected==='unknown')body=`<h2>外部动作 A-17 结果未知</h2><p>本地超时不能证明外部操作失败。当前未提供“再次执行”按钮。</p><div class="status" role="status">${phase===0?'先查询外部状态，或提供外部确认回执。':'外部确认：原动作已执行。记录回执，继续整理结果，不重复执行。'}</div><div class="actions"><button id="act">${phase===0?'取得已执行回执（模拟）':'重新演示'}</button></div>`;
 if(selected==='unsupported')body=`<h2>当前专业能力不能完成独立AC复核</h2><div class="status" role="status">${phase===0?'方案保持未验证，不能显示“满足电压约束”。':'已记录资源需求：等待注册支持AC复核的专业能力；任务仍待补充。'}</div><p>可保留已有分析。只有用户明确修改目标后才能按缩小的范围交付；通用代码不替代专业事实来源。</p><div class="actions"><button id="act">${phase===0?'记录所需能力（模拟）':'重新演示'}</button></div>`;
 $('panel').innerHTML=body+'<footer>原型状态不会成为真实任务回执或专业证据。实现以服务端快照和事件为准。</footer>';
 document.querySelectorAll('[data-case]').forEach(b=>b.onclick=()=>{selected=b.dataset.case;phase=0;render();document.querySelector(`[data-case="${selected}"]`).focus()});
 if($('act'))$('act').onclick=()=>{if(selected==='question'&&phase===0&&!$('reply').value.trim()){$('reply').focus();return}const max=['upload','question','connection'].includes(selected)?2:1;phase=(phase+1)%(max+1);render();$('act').focus()};
 if($('task')){$('task').value=task;$('draft').value=drafts[task];$('draft').oninput=()=>drafts[task]=$('draft').value;$('task').onchange=()=>{task=$('task').value;render();$('task').focus()}};
}render();
</script></html>
