const $=id=>document.getElementById(id);let active='report',tab='main',archived=false,toastTimer;const enabled=new Set(['general','grid']);

function initial(s){if(s.kind==='report')return `<article class="msg user">请分析近两个月以来，各省现货地板价、负电价期间省间外送通道的利用情况、新能源消纳情况，并完成分析报告。</article><article class="msg">${author}<p>这项分析需要同时核对价格事件、外送通道和新能源数据。我会在已有业务资料的基础上形成分析，报告随发现逐步完善。</p><div class="findings"><p><strong>先明确可支持的结论</strong></p><p>通道利用需要对应时段的实际潮流和可用限额。新能源消纳需要可靠的可用功率或正式统计口径。</p></div><div class="statusline">原型状态：尚未连接业务资料与数据</div><button class="artifactcard" data-open-art><span class="fileicon">DOC</span><span><strong>市场运行分析报告</strong><small>成果结构预览 · v0.2 · 尚无业务结论</small></span><span class="arrow">↗</span></button><p class="annotation">右侧示意报告与对话协同。实际内容将来自任务执行，不预填分析结论。</p></article>`;

if(s.kind==='news')return `<article class="msg user">今天的国际要闻。</article><article class="msg">${author}<p>这类问题需要实时检索，并核对新闻发生时间与来源。</p><div class="statusline">交互原型未联网，不展示虚构的当日新闻。</div><p class="annotation">实际应用将在同一对话中展示检索结果及来源；无需切换到另一种智能体模式。</p></article>`;
return `<article class="msg welcome"><div class="overline">A SPACE FOR YOUR WORK</div><h2>从一个问题开始，<br>让工作逐步成形。</h2><p>提出目标，附加资料，或继续一项研究。</p><div class="suggestions"><button data-suggest="请帮我分析这份资料，并形成一份报告。">分析资料</button><button data-suggest="请帮我研究一个问题，先核对可用的依据。">研究问题</button><button data-suggest="请解释一个概念。">直接提问</button></div></article>`}

function paper(){const s=current(),v=s.version;if(tab==='basis'){$('artifactContent').innerHTML=`<div class="paper"><div class="docmeta"><span>RESOURCE & EVIDENCE</span><span>原型</span></div><h2>依据与输入</h2><p>每项资料需要保留来源与版本。当前仅演示资源状态，没有已接入数据。</p>${(s.kind==='decision'?['网络模型与设备标识','同一时刻的运行快照','可调资源及约束','专业计算与验证结果']:['价格与市场规则','通道潮流、方向与限额','新能源出力与消纳口径','分析方法与生成产物']).map(t=>`<div class="rail"><strong>${t}</strong><p>尚未接入 · 无当前任务证据</p></div>`).join('')}</div>`;return}
if(s.kind==='decision'){$('artifactContent').innerHTML=`<div class="paper"><div class="docmeta"><span>SCENARIO / 01</span><span>示意 · 非真实网络</span></div><h2>从故障场景<br>到可验证的方案</h2><p class="deck">模型、条件与方案始终属于同一任务。</p><svg class="network" viewBox="0 0 400 210" role="img" aria-label="仅用于布局展示的节点结构图，非真实电网"><line x1="65" y1="70" x2="195" y2="50"/><line x1="65" y1="70" x2="120" y2="155"/><line x1="195" y1="50" x2="120" y2="155"/><line x1="195" y1="50" x2="330" y2="105" style="stroke:#a67c42;stroke-dasharray:7 5"/><line x1="120" y1="155" x2="330" y2="105"/><circle cx="65" cy="70" r="8"/><circle cx="195" cy="50" r="8"/><circle cx="120" cy="155" r="8"/><circle cx="330" cy="105" r="8"/><text x="45" y="49">节点 A</text><text x="175" y="30">节点 B</text><text x="100" y="184">节点 C</text><text x="310" y="132">节点 D</text></svg><div class="checkgrid"><div>运行快照<small>等待选择</small></div><div>故障对象<small>等待确认</small></div><div>电压要求<small>用户指定 0.95–1.05 p.u.</small></div><div>优化目标<small>需要明确代价与优先级</small></div></div><h3><span class="docnum">01</span>候选方案与验证</h3><div class="note">尚无计算结果。方案对比将在实际求解与复核后呈现；不把结构示意图当作可计算模型。</div><div class="docfooter"><span>CAPSTONE / DECISION WORKSPACE</span><span>原型 ${v==='1'?'v0.1':'v0.2'}</span></div></div>`;return}
$('artifactContent').innerHTML=`<div class="paper"><div class="docmeta"><span>CAPSTONE / RESEARCH NOTE</span><span>DRAFT · 0${v}</span></div><h2>现货价格事件期间<br>外送通道与新能源分析</h2><p class="deck">任务成果结构预览<br>统计范围与业务口径将在资料接入后确定。</p><div class="docline"></div><h3><span class="docnum">01</span>分析范围</h3><p>覆盖价格事件、通道利用和新能源表现。区分有效数据范围、相关性观察与可验证的解释。</p><h3><span class="docnum">02</span>数据与口径</h3><table class="datatable"><thead><tr><th>分析对象</th><th>所需依据</th><th>状态</th></tr></thead><tbody><tr><td>价格事件</td><td>市场价格与适用规则</td><td class="pending">待接入</td></tr><tr><td>通道利用</td><td>实际潮流与时段限额</td><td class="pending">待接入</td></tr><tr><td>新能源</td><td>出力及可靠消纳资料</td><td class="pending">待接入</td></tr></tbody></table>${v==='2'?'<h3><span class="docnum">03</span>结论与适用边界</h3><div class="note">当前没有业务结果。缺少可靠限发或可用功率数据时，不能将出力偏差直接表述为弃电。</div>':'<p class="annotation">初始版本仅展示范围与资料结构。</p>'}<div class="docfooter"><span>WORK IN PROGRESS</span><span>非业务报告 · 设计样稿</span></div></div>`}
function openArt(){if(['plain','news','new'].includes(current().kind)){toast('当前会话尚无成果文件。');return}$('body').classList.remove('closed');$('body').classList.add('mobile-art');$('toggleArtifact').setAttribute('aria-expanded','true')}
function closeArt(){$('body').classList.add('closed');$('body').classList.remove('mobile-art');$('toggleArtifact').setAttribute('aria-expanded','false')}
function render(){const s=current();$('title').textContent=s.title;const decision=s.kind==='decision',rich=['report','decision'].includes(s.kind);$('crumb').textContent=decision?'模型与决策':rich?'分析与报告':'对话';$('eyebrow').textContent=decision?'SCENARIO & DECISION':rich?'ANALYSIS & REPORT':'CONVERSATION';$('viewlabel').textContent=decision?'专业决策视图':rich?'分析工作视图':'轻量对话';$('tabmain').textContent=decision?'场景与方案':'报告';$('input').value=s.draft;$('version').value=s.version;$('body').classList.toggle('closed',!rich);$('body').classList.remove('mobile-art');$('toggleArtifact').textContent=decision?'场景工作区':'成果工作区';$('toggleArtifact').setAttribute('aria-expanded',String(rich));$('artifactStatus').textContent=decision?'场景结构示意 · 尚未计算':'草稿结构 · 尚未执行分析';$('attached').hidden=!s.attachment;$('attached').textContent=s.attachment?'已选择（仅原型本地）：'+s.attachment:'';showMessages();paper();renderNav()}
function switchSession(id){current().draft=$('input').value;active=id;tab='main';document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));render();$('nav').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}
document.addEventListener('click',e=>{const target=e.target.closest('button');if(!target)return;if(target.dataset.session)switchSession(target.dataset.session);if(target.hasAttribute('data-open-art'))openArt();if(target.dataset.suggest){$('input').value=target.dataset.suggest;current().draft=$('input').value;$('input').focus()}if(target.dataset.tab){tab=target.dataset.tab;document.querySelectorAll('.tab').forEach(b=>b.setAttribute('aria-selected',String(b===target)));$('artifactContent').setAttribute('aria-labelledby',target.id||'tabmain');paper()}});
$('input').oninput=()=>current().draft=$('input').value;$('form').onsubmit=e=>{e.preventDefault();const s=current(),t=$('input').value.trim();if(!t)return;if(!enabled.has('general')){toast('请先启用通用企业执行能力组。');return}s.messages.push({user:true,text:t},{text:'已在原型中记录这条要求。此页面不连接智能体，实际执行、进展和成果将由统一任务服务提供。'});s.draft='';$('input').value='';showMessages();$('messages').scrollTop=$('messages').scrollHeight};
$('new').onclick=()=>{current().draft=$('input').value;const id='new-'+Date.now();sessions.unshift({id,title:'新的工作',kind:'new',meta:'尚未开始',draft:'',version:'2',messages:[]});archived=false;switchSession(id)};
$('toggleArtifact').onclick=()=>{if($('body').classList.contains('closed')||(innerWidth<=900&&!$('body').classList.contains('mobile-art')))openArt();else closeArt()};$('closeArtifact').onclick=()=>{closeArt();$('toggleArtifact').focus()};$('version').onchange=()=>{current().version=$('version').value;paper()};

$('rename').onclick=()=>{$('renameInput').value=current().title;$('renameDialog').showModal()};$('renameCancel').onclick=()=>$('renameDialog').close();$('renameSave').onclick=()=>{const t=$('renameInput').value.trim();if(!t)return;current().title=t;$('renameDialog').close();render()};$('archive').onclick=()=>{current().archived=!current().archived;toast(current().archived?'会话已归档（原型）':'会话已恢复（原型）');archived=!!current().archived;renderNav()};$('archiveList').onclick=()=>{archived=!archived;renderNav()};
$('attach').onclick=()=>$('file').click();$('file').onchange=()=>{const f=$('file').files[0];if(f){current().attachment=f.name;$('attached').textContent='已选择（仅原型本地）：'+f.name;$('attached').hidden=false;toast('只记录文件名；没有上传或读取文件内容。')} $('file').value=''};
$('menu').onclick=()=>{$('nav').classList.toggle('open');$('menu').setAttribute('aria-expanded',String($('nav').classList.contains('open')))};document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('nav').classList.remove('open');$('menu').setAttribute('aria-expanded','false')}});
$('download').onclick=()=>{const text='Capstone 交互设计样稿\n非真实分析报告，未查询数据或执行计算。\n\n'+$('artifactContent').innerText;const u=URL.createObjectURL(new Blob([text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=u;a.download='capstone-design-sample.txt';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已下载明确标注的原型样稿。')};

const STORAGE='capstone-enterprise-prototype-v2';
function restorePrototype(){try{const saved=JSON.parse(localStorage.getItem(STORAGE)||'null');if(!saved||saved.schema!==2||!Array.isArray(saved.sessions)||saved.sessions.length>40)return;
 const valid=saved.sessions.every(s=>s&&typeof s.id==='string'&&/^[a-z0-9-]{1,80}$/.test(s.id)&&typeof s.title==='string'&&s.title.length<=60&&['report','decision','plain','news','new'].includes(s.kind)&&typeof s.draft==='string'&&s.draft.length<=20000&&Array.isArray(s.messages)&&s.messages.length<=100&&s.messages.every(m=>typeof m.text==='string'&&m.text.length<=20000));
 if(!valid||new Set(saved.sessions.map(s=>s.id)).size!==saved.sessions.length||!saved.sessions.length)return;
 sessions.splice(0,sessions.length,...saved.sessions);active=sessions.some(s=>s.id===saved.active)?saved.active:sessions[0].id;
 if(Array.isArray(saved.enabled)){enabled.clear();saved.enabled.filter(v=>['general','grid'].includes(v)).forEach(v=>enabled.add(v));}
 archived=!!current().archived;
 }catch{/* An invalid or unavailable local store never blocks the prototype. */}}
function persistPrototype(){try{localStorage.setItem(STORAGE,JSON.stringify({schema:2,sessions,active,enabled:[...enabled]}));}catch{}}
const chartRows=[['01',32,45],['02',48,51],['03',43,62],['04',64,57],['05',59,68],['06',73,61],['07',68,74],['08',81,70]];
function chartSvg(){const px=i=>65+i*60,py=v=>260-v*2;return '<svg id="chartSvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 330" role="img" aria-labelledby="chartTitle chartDesc" style="width:100%;background:#fffef9"><title id="chartTitle">合成数据图形排版示例</title><desc id="chartDesc">两条示意序列，仅用于检查图形样式，不是电力业务数据。</desc><rect width="540" height="330" fill="#fffef9"/>'+[0,25,50,75,100].map(v=>'<line x1="65" x2="490" y1="'+py(v)+'" y2="'+py(v)+'" stroke="#e0e5d8"/><text x="48" y="'+(py(v)+4)+'" text-anchor="end" font-size="11" fill="#66745d">'+v+'</text>').join('')+'<text x="65" y="30" font-size="11" fill="#53674b">示意指标 / %</text>'+chartRows.map((r,i)=>'<text x="'+px(i)+'" y="282" text-anchor="middle" font-size="11" fill="#66745d">'+r[0]+'</text>').join('')+'<polyline fill="none" stroke="#305f45" stroke-width="2.5" points="'+chartRows.map((r,i)=>px(i)+','+py(r[1])).join(' ')+'"/><polyline fill="none" stroke="#aa8541" stroke-width="2.2" stroke-dasharray="6 4" points="'+chartRows.map((r,i)=>px(i)+','+py(r[2])).join(' ')+'"/>'+chartRows.map((r,i)=>'<circle cx="'+px(i)+'" cy="'+py(r[1])+'" r="3.5" fill="#fffef9" stroke="#305f45" stroke-width="1.8"/>').join('')+'<text x="65" y="315" font-size="10" fill="#66745d">合成数据 · 仅供设计排版 · 横轴为样本序号</text></svg>'}
function chartPaper(){const table=chartRows.map(r=>'<tr><td>'+r[0]+'</td><td>'+r[1]+'</td><td>'+r[2]+'</td></tr>').join('');$('artifactContent').innerHTML='<div class="paper"><div class="docmeta"><span>FIGURE / DESIGN STUDY</span><span>合成数据</span></div><h2>图表也是<br>可核验的工作成果</h2><p class="deck">专业排版 · 数据依据 · 可复算方法 · 独立导出</p><div class="docline"></div><h3>图 01　两组示意序列的对比</h3>'+chartSvg()+'<div style="display:flex;gap:24px;font-size:11px;margin:8px 0 22px"><span style="color:#305f45">— ○ 示意序列 A</span><span style="color:#896929">┄ 示意序列 B</span></div><div class="note">此处展示8个合成样本，仅用于设计评审。实际图形由任务数据与分析方法生成，不采用原型数值。</div><div class="prototype-actions"><button id="exportChart">下载示意 SVG</button><button id="toggleChartData">查看图表数据</button></div><div id="chartData" hidden><table class="datatable"><thead><tr><th>样本序号</th><th>序列 A / %</th><th>序列 B / %</th></tr></thead><tbody>'+table+'</tbody></table></div><h3>依据与复现</h3><p>来源：原型内置合成数组<br>处理：直接绘制，未聚合或插值<br>业务口径：无，不代表通道利用或新能源指标</p><div class="docfooter"><span>PREVIEW + DATA + METHOD</span><span>仅设计示意</span></div></div>';$('toggleChartData').onclick=()=>{$('chartData').hidden=!$('chartData').hidden;$('toggleChartData').textContent=$('chartData').hidden?'查看图表数据':'收起图表数据'};$('exportChart').onclick=()=>{const u=URL.createObjectURL(new Blob([$('chartSvg').outerHTML],{type:'image/svg+xml'}));const a=document.createElement('a');a.href=u;a.download='synthetic-design-chart.svg';a.click();setTimeout(()=>URL.revokeObjectURL(u),1000);toast('已导出标明合成数据的设计示意图。')};}
const basePaper=paper;paper=function(){if(tab==='chart'){chartPaper();return}basePaper();const s=current();if(s.version==='3'&&tab==='main'){$('artifactContent').querySelector('.paper')?.insertAdjacentHTML('beforeend','<div class="canvas-note"><span>03</span><span>新增版本示意：已补充待核验事项。<br>这只是原型状态变化，没有分析或计算结果。</span></div>');}};
function phaseName(s){return ({running:'正在推进 · 原型演示',paused:'已暂停 · 原型演示',waiting:'等待补充 · 原型演示',updated:'新草稿已保存 · 原型演示'})[s.demoPhase]||'等待资料 · 原型演示'}
function showProgress(){const s=current();$('progressTitle').textContent='任务进展 · '+s.title;const entries=s.demoEvents||['建立任务与成果结构'];$('progressBody').innerHTML='<p class="activity-only">以下由原型控制按钮生成，用于评审交互；不是智能体真实执行轨迹。</p><ol class="progress-list">'+entries.map((t,i)=>'<li>'+escape(t)+'<small>原型事件 '+String(i+1).padStart(2,'0')+'</small></li>').join('')+'</ol>';const rich=['report','decision'].includes(s.kind);$('advanceDemo').hidden=!rich;$('pauseDemo').hidden=!rich;$('pauseDemo').textContent=s.demoPhase==='paused'?'继续演示':'暂停演示';$('progressDialog').showModal()}
function progressState(){const s=current(),rich=['report','decision'].includes(s.kind);const old=$('taskstrip');if(old)old.remove();if(rich){$('messages').insertAdjacentHTML('beforeend','<div id="taskstrip" class="task-strip"><span class="state-mark"></span><strong>'+escape(phaseName(s))+'<small>任务级状态与事件，无固定流程百分比</small></strong><button id="showProgress">查看进展</button></div>');$('showProgress').onclick=showProgress;}
 const oldUpdate=$('versionUpdate');if(oldUpdate)oldUpdate.remove();if(s.latestVersion==='3'&&s.version!=='3'){$('artifactContent').insertAdjacentHTML('beforebegin','<div id="versionUpdate" class="version-update"><span>有新的草稿版本 · v0.3</span><button id="latestVersion">查看最新版本</button></div>');$('latestVersion').onclick=()=>{s.version='3';$('version').value='3';paper();progressState();persistPrototype()};}
 const option=$('version').querySelector('option[value="3"]');if(s.latestVersion==='3'&&!option){const o=document.createElement('option');o.value='3';o.textContent='v0.3 · 新草稿示意';$('version').prepend(o)}else if(s.latestVersion!=='3'&&option)option.remove();$('version').value=s.version;$('body').classList.toggle('decision',s.kind==='decision');}
const baseRender=render;render=function(){baseRender();progressState();$('capCount').textContent=enabled.size;persistPrototype()};
document.body.insertAdjacentHTML('beforeend','<dialog id="progressDialog" aria-labelledby="progressTitle"><h2 id="progressTitle">任务进展</h2><div id="progressBody"></div><div class="prototype-actions"><button id="advanceDemo">推进演示</button><button id="pauseDemo">暂停演示</button></div><div class="dialogactions"><button class="outline" id="closeProgress">关闭</button></div></dialog>');
$('closeProgress').onclick=()=>$('progressDialog').close();$('pauseDemo').onclick=()=>{const s=current();s.demoPhase=s.demoPhase==='paused'?'running':'paused';(s.demoEvents??=[]).push(s.demoPhase==='paused'?'暂停已生效（模拟），资料与草稿保留':'恢复执行（模拟），沿用已有资料与目标');$('progressDialog').close();progressState();persistPrototype();showProgress()};
$('advanceDemo').onclick=()=>{const s=current();if(s.demoPhase==='paused'){toast('请先继续演示。');return}const phase=s.demoPhase||'idle';if(phase==='idle'){s.demoPhase='running';(s.demoEvents??=[]).push('开始读取资料（模拟），未执行真实查询');}else if(phase==='running'){s.demoPhase='waiting';(s.demoEvents??=[]).push('发现输入不足（模拟），等待补充或调整范围');}else{s.demoPhase='updated';s.latestVersion='3';(s.demoEvents??=[]).push('保存新草稿v0.3（模拟），保留旧版本供比较');}$('progressDialog').close();progressState();persistPrototype();showProgress()};
document.querySelector('.navfoot').insertAdjacentHTML('beforebegin','<button id="resetPrototype" class="subtle" style="color:#bbc6b5;font-size:10px;text-align:left">重置原型本地记录</button>');$('resetPrototype').onclick=()=>{if(confirm('仅清除这个交互原型的本地会话与草稿？不会影响Capstone业务数据。')){try{localStorage.removeItem(STORAGE)}catch{}location.reload()}};
