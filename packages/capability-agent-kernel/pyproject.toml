[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capability-agent-kernel"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "filelock>=3.20,<4",
  "pydantic>=2.12,<3",
  "python-dotenv>=1.2,<2",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/capability_agent"]
