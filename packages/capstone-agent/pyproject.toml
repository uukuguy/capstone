[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capstone-agent"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.40,<2",
  "capability-agent-kernel==0.1.0",
  "enterprise-research-domain-pack==1.0.0",
  "capstone-model-capability-spi==0.1.0",
  "fastapi>=0.139,<1",
  "google-cloud-storage>=3.14,<4",
  "httpx>=0.28,<1",
  "jsonschema>=4.26,<5",
  "psycopg[binary]>=3.2,<4",
  "python-dotenv>=1.2,<2",
  "referencing>=0.37,<1",
  "textual>=8,<9",
  "uvicorn>=0.51,<1",
]

[project.scripts]
capstone-agent = "capstone_agent.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/capstone_agent"]
exclude = [
  "/src/capstone_agent/resources/application-capacity.json",
  "/src/capstone_agent/resources/capstone-pi",
  "/src/capstone_agent/resources/execution-guidance.mjs",
  "/src/capstone_agent/resources/runtime-limits.mjs",
  "/src/capstone_agent/resources/task-record-tools.mjs",
]

[tool.hatch.build.targets.wheel.force-include]
"src/capstone_agent/resources/application-capacity.json" = "capstone_agent/resources/application-capacity.json"
"src/capstone_agent/resources/capstone-pi" = "capstone_agent/resources/capstone-pi"
"src/capstone_agent/resources/execution-guidance.mjs" = "capstone_agent/resources/execution-guidance.mjs"
"src/capstone_agent/resources/runtime-limits.mjs" = "capstone_agent/resources/runtime-limits.mjs"
"src/capstone_agent/resources/task-record-tools.mjs" = "capstone_agent/resources/task-record-tools.mjs"

[tool.hatch.build.targets.sdist]
exclude = [
  "/src/capstone_agent/resources/application-capacity.json",
  "/src/capstone_agent/resources/capstone-pi",
  "/src/capstone_agent/resources/execution-guidance.mjs",
  "/src/capstone_agent/resources/runtime-limits.mjs",
  "/src/capstone_agent/resources/task-record-tools.mjs",
]

[tool.hatch.build.targets.sdist.force-include]
"../../configs/runtime/application-capacity.json" = "src/capstone_agent/resources/application-capacity.json"
"../../configs/runtime/capstone-pi" = "src/capstone_agent/resources/capstone-pi"
"../pi-capability-tools/src/execution-guidance.mjs" = "src/capstone_agent/resources/execution-guidance.mjs"
"../pi-capability-tools/src/runtime-limits.mjs" = "src/capstone_agent/resources/runtime-limits.mjs"
"../pi-capability-tools/src/task-record-tools.mjs" = "src/capstone_agent/resources/task-record-tools.mjs"

[tool.uv.sources]
capability-agent-kernel = { path = "../capability-agent-kernel", editable = true }
enterprise-research-domain-pack = { path = "../enterprise-research-domain-pack", editable = true }
capstone-model-capability-spi = { path = "../capstone-model-capability-spi", editable = true }
