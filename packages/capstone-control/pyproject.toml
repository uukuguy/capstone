[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "capstone-control"
version = "0.1.0"
requires-python = ">=3.12"
description = "Durable Goal and Agent delegation coordination"
dependencies = ["psycopg[binary]>=3.2,<4"]

[tool.hatch.build.targets.wheel]
packages = ["src/capstone_control"]
