[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-domain-pack"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "capability-agent-kernel==0.1.0",
  "inventory-reference-service==0.1.0",
  "pydantic>=2.12,<3",
]

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.uv.sources]
capability-agent-kernel = { path = "../capability-agent-kernel", editable = true }
inventory-reference-service = { path = "../inventory-reference-service", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_domain"]
