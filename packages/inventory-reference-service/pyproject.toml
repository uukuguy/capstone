[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-reference-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.12,<3"]

[project.scripts]
inventoryctl = "inventory_reference.cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_reference"]
