[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pandapower-application"
version = "0.1.0"
description = "Application bindings and reader projections for pandapower static analysis"
requires-python = ">=3.12"
dependencies = [
  "capstone-agent==0.1.0",
  "capability-agent-kernel==0.1.0",
  "pandapower-domain-pack==0.1.0",
  "pydantic>=2.12,<3",
]

[tool.uv.sources]
capstone-agent = { path = "../capstone-agent", editable = true }
capability-agent-kernel = { path = "../capability-agent-kernel", editable = true }
pandapower-domain-pack = { path = "../pandapower-domain-pack", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/pandapower_application"]
