[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pypsa-model-authority"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pypsa==1.3.0", "highspy==1.15.1", "pydantic>=2.12,<3"]

[project.scripts]
pypsamodelctl = "pypsa_model_authority.cli:main"
pypsaopsctl = "pypsa_model_authority.ops_cli:main"
pypsaplanctl = "pypsa_model_authority.plan_cli:main"
pypsasectorctl = "pypsa_model_authority.sector_cli:main"

[dependency-groups]
dev = ["pytest>=9,<10"]

[tool.hatch.build.targets.wheel]
packages = ["src/pypsa_model_authority"]
